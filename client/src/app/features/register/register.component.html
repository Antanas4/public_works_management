<div class="register-container">
    <mat-card class="register-card">
        <mat-card-header>
            <mat-card-title>Create Account</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Username</mat-label>
                    <input matInput formControlName="username" required>
                    <mat-error *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
                        {{ getErrorMessage('username') }}
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" formControlName="email" required>
                    <mat-error *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                        {{ getErrorMessage('email') }}
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password" required>
                    <mat-error *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                        {{ getErrorMessage('password') }}
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirm Password</mat-label>
                    <input matInput type="password" formControlName="confirmPassword" required>
                    <mat-error *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
                        {{ getErrorMessage('confirmPassword') }}
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>User Type</mat-label>
                    <mat-select formControlName="type">
                        <mat-option *ngFor="let type of userTypes" [value]="type.value">
                            {{ type.label }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="registerForm.get('type')?.invalid && registerForm.get('type')?.touched">
                        {{ getErrorMessage('type') }}
                    </mat-error>
                </mat-form-field>

                <div class="button-container">
                    <button mat-raised-button color="primary" type="submit" [disabled]="isLoading || registerForm.invalid">
                        <span *ngIf="!isLoading">Create Account</span>
                        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
                    </button>
                </div>
            </form>
        </mat-card-content>
        <mat-card-actions align="center">
            <button mat-button color="accent" routerLink="/login">
                Already have an account? Login
            </button>
        </mat-card-actions>
    </mat-card>
</div>
