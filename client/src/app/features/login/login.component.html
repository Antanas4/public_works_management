<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Prisijunkite prie sistemos</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Vartotojo vardas</mat-label>
          <input matInput formControlName="username" required>
          @if (loginForm.get('username')?.hasError('required')) {
            <mat-error>
              Vartotojo vardas yra privalomas
            </mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Slaptažodis</mat-label>
          <input matInput type="password" formControlName="password" required>
          @if (loginForm.get('password')?.hasError('required')) {
            <mat-error>
              Slaptažodis yra privalomas
            </mat-error>
          }
        </mat-form-field>
        <div class="button-container">
          <button mat-raised-button
                  color="primary"
                  type="submit"
                  [disabled]="isLoading || loginForm.invalid">
            @if (!isLoading) {
              <span>Prisijungti</span>
            }
            @if (isLoading) {
              <mat-spinner diameter="20"></mat-spinner>
            }
          </button>
        </div>
      </form>
    </mat-card-content>
    <mat-card-actions align="center">
      <button mat-button color="accent" routerLink="/register">
        Registruotis
      </button>
    </mat-card-actions>
  </mat-card>
</div>
